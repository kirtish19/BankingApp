apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankingapp-loanapi

spec:
  replicas: 2

  selector:
    matchLabels:
      app: bankingapp-loanapi

  template:
    metadata:
      labels:
        app: bankingapp-loanapi
        azure.workload.identity/use: "true"

    spec:
      serviceAccountName: loanapi-sa

      containers:

      - name: bankingapp-loanapi

        image: team1bankingappacr.azurecr.io/bankingapp-loanapi:v1
        imagePullPolicy: Always

        ports:
          - containerPort: 8080