apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankingapp-ui

spec:
  replicas: 2

  selector:
    matchLabels:
      app: bankingapp-ui

  template:
    metadata:
      labels:
        app: bankingapp-ui

    spec:
      containers:

      - name: bankingapp-ui

        image: team1bankingappacr.azurecr.io/bankingapp-ui:v1
        imagePullPolicy: Always

        ports:
          - containerPort: 8080